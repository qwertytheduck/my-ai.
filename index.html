<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SECURE_STATION_GHOST</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; height: 100vh; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        #terminal { width: 85%; border: 1px solid #00ff41; padding: 20px; background: #050505; box-shadow: 0 0 30px #00ff41; text-align: center; }
        .system { color: #00ff41; margin-bottom: 15px; display: block; font-size: 1.2rem; }
        .btn { background: #00ff41; color: #000; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 5px; margin: 10px; font-family: inherit; }
        .btn-ghost { background: #111; color: #00ff41; border: 1px solid #00ff41; }
        .btn:hover { background: #fff; color: #000; }
    </style>
</head>
<body onclick="activateShield()">

<div id="terminal">
    <span class="system">[STATUS]: GHOST PROTOCOL STANDBY.</span>
    <span class="system">[SECURITY]: UNAUTHORIZED CLOSURE BLOCKED.</span>
    <button class="btn" onclick="authorizeExit()">AUTHORIZE EXIT</button>
    <button class="btn btn-ghost" onclick="toggleGhost()">GHOST MODE</button>
</div>

<script>
    let exitAuthorized = false;
    let isGhost = false;

    // 1. ACTIVATE SHIELD (Required for browser to allow window manipulation)
    function activateShield() {
        console.log("Shield Active.");
    }

    // 2. GHOST MODE (Simulates minimization by shrinking the window)
    function toggleGhost() {
        isGhost = !isGhost;
        if (isGhost) {
            window.resizeTo(200, 200);
            window.moveTo(0, 0);
            alert("GHOST MODE: RESIZING WINDOW. CLICK AGAIN TO RESTORE.");
        } else {
            window.resizeTo(window.screen.availWidth, window.screen.availHeight);
        }
    }

    // 3. THE RECOVERY TRAP (The "about:blank" loop)
    window.onbeforeunload = function(e) {
        if (!exitAuthorized) {
            // Respawn strategy: Open a new window that points back here
            const recoveryScript = `
                <html>
                <body style="background:#000;color:#00ff41;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;">
                    <div style="text-align:center;">
                        <h2>RECOVERY INITIATED</h2>
                        <p>Redirecting to Secure Uplink...</p>
                        <script>
                            setTimeout(() => { window.location.href = "${window.location.href}"; }, 300);
                        <\/script>
                    </div>
                </body>
                </html>
            `;
            
            let ghostTab = window.open('about:blank', '_blank');
            if (ghostTab) {
                ghostTab.document.write(recoveryScript);
            }

            // Modern browser confirmation dialog
            const warn = "AUTHORIZATION REQUIRED. EXIT DENIED.";
            (e || window.event).returnValue = warn;
            return warn;
        }
    };

    // 4. AUTHORIZED EXIT
    function authorizeExit() {
        exitAuthorized = true;
        alert("TERMINATION AUTHORIZED.");
        window.close(); // Only works if the tab was opened via script; otherwise, manually close now.
    }

    // Persistence: Always keep current location in Local Storage for recovery
    localStorage.setItem('secure_uplink_url', window.location.href);
</script>
</body>
</html>
